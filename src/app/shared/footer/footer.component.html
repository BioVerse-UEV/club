<footer class="footer">
  <span class="footer__copy">&copy; {{ anio }} {{ nombreClub }}</span>

  <div class="footer__redes">
    @for (red of redes; track red.nombre) {
      <a
        class="footer__red"
        [href]="red.url"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="red.nombre"
        [title]="red.nombre">
        <img [src]="'img/iconos/' + red.icono + '.svg'" alt="">
      </a>
    }
  </div>

  <span class="footer__credito">A Kallik Project</span>
</footer>
