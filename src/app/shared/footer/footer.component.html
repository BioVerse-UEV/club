<footer class="footer">
  <div class="footer__redes">
    @for (red of redes; track red.nombre) {
      <a [href]="red.url" target="_blank" rel="noopener">{{ red.nombre }}</a>
    }
  </div>
  <div class="footer__creditos">
    <span>&copy; {{ anio }} {{ nombreClub }}</span>
    <span>A Kallik Project</span>
  </div>
</footer>
