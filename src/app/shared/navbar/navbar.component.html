<header class="navbar">
  <div class="navbar__logo">
    <img src="img/logo-header.png" [alt]="nombreClub">
  </div>
  <nav class="navbar__nav">
    <ul>
      @for (item of navegacion; track item.ruta) {
        <li>
          <a [routerLink]="item.ruta"
             routerLinkActive="navbar__link--activo"
             [routerLinkActiveOptions]="{exact: true}"
             class="navbar__link">
            {{ item.etiqueta | traducir }}
          </a>
        </li>
      }
    </ul>
  </nav>
  <div class="navbar__idiomas">
    <button (click)="translationService.cambiarIdioma('es')">Es</button>
    <span>/</span>
    <button (click)="translationService.cambiarIdioma('en')">Eng</button>
  </div>
</header>
