<model-viewer
  [attr.src]="modelo.archivo"
  [attr.orientation]="modelo.orientacion"
  [attr.camera-orbit]="modelo.camara"
  camera-controls
  auto-rotate
  auto-rotate-delay="0"
  rotation-per-second="20deg"
  disable-zoom
  interaction-prompt="none"
  shadow-intensity="1"
  class="logo-3d">
</model-viewer>
