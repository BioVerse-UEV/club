<div class="media">
  <div class="media__redes">
    @for (red of redesVideo; track red.nombre) {
      <a [href]="red.url" target="_blank" rel="noopener" class="media__red-icono" [attr.aria-label]="red.nombre">
        <img [src]="'img/iconos/' + red.icono + '.svg'" alt="">
      </a>
    }
  </div>

  <div class="media__lista">
    @for (publicacion of publicaciones; track publicacion.id) {
      <div class="media__fila">
        <a [href]="publicacion.url" target="_blank" rel="noopener" class="media__video">
          @if (publicacion.enVivo) {
            <span class="media__en-vivo">
              <span class="media__en-vivo-punto"></span>
              {{ 'media.enVivo' | traducir }}
            </span>
          }
          <svg class="media__play" viewBox="0 0 24 24" width="48" height="48" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </a>
        <p class="media__descripcion">{{ publicacion.descripcion }}</p>
      </div>
    }
  </div>
</div>
