<div class="conocenos">
  <aside class="conocenos__texto">
    <p>{{ 'conocenos.textoIzquierda' | traducir }}</p>
  </aside>

  <div class="conocenos__arbol">
    <img class="conocenos__logo" src="img/logo-header.png" alt="BioVerse">

    @for (fila of filas; track $index) {
      <div class="conocenos__tronco"></div>
      <div class="conocenos__fila" [class.conocenos__fila--unico]="fila.length === 1">
        @for (miembro of fila; track miembro.id) {
          <div class="conocenos__miembro">
            <img [src]="miembro.foto" [alt]="miembro.nombre" [title]="miembro.nombre + ' — ' + miembro.rol">
          </div>
        }
      </div>
    }
  </div>

  <aside class="conocenos__texto conocenos__texto--derecha">
    <p>{{ 'conocenos.textoDerecha' | traducir }}</p>
  </aside>
</div>
